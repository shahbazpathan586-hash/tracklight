<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TrackLight — Agency Analytics</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📊%3C/text%3E%3C/svg%3E" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b0f17; --panel: #131a26; --panel2: #1a2333; --border: #243047;
    --text: #e8edf7; --muted: #8b9bb4; --accent: #6366f1; --accent-2: #818cf8;
    --green: #10b981; --red: #ef4444; --yellow: #f59e0b; --blue: #3b82f6;
    --shadow: 0 4px 16px rgba(0,0,0,.3);
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; }

  /* LOGIN */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-box { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 32px; width: 100%; max-width: 380px; box-shadow: var(--shadow); }
  .login-box h1 { font-size: 26px; margin-bottom: 6px; }
  .login-box .sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .login-box input { width: 100%; padding: 12px 14px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 15px; margin-bottom: 12px; }
  .login-box input:focus { outline: none; border-color: var(--accent); }
  .login-box button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none;
    border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .login-box button:hover { background: var(--accent-2); }
  .login-err { background: rgba(239,68,68,.1); color: var(--red); padding: 10px 12px; border-radius: 8px;
    font-size: 13px; margin-bottom: 12px; display: none; }

  /* APP LAYOUT */
  .app { display: block; min-height: 100vh; }
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 240px; background: var(--panel);
    border-right: 1px solid var(--border); padding: 20px 12px; overflow-y: auto; }
  .logo { font-size: 20px; font-weight: 700; padding: 0 8px 20px; display: flex; align-items: center; gap: 10px; }
  .logo .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px;
    color: var(--muted); cursor: pointer; font-size: 14px; margin-bottom: 2px; }
  .nav-item:hover { background: var(--panel2); color: var(--text); }
  .nav-item.active { background: var(--accent); color: white; }
  .nav-item .num { margin-left: auto; font-size: 12px; opacity: 0.8; }
  .nav-section { font-size: 11px; text-transform: uppercase; color: var(--muted); margin: 16px 8px 6px; letter-spacing: 0.5px; }

  .main { margin-left: 240px; padding: 24px 32px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .topbar h1 { font-size: 22px; }
  .topbar .right { display: flex; gap: 10px; align-items: center; }
  .btn { padding: 8px 14px; background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); cursor: pointer; font-size: 13px; }
  .btn:hover { background: var(--border); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: white; }
  .btn-primary:hover { background: var(--accent-2); }
  .btn-danger { background: transparent; border-color: var(--red); color: var(--red); }
  .btn-danger:hover { background: rgba(239,68,68,.1); }

  /* CARDS */
  .grid { display: grid; gap: 16px; }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  .grid-2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 1100px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } .grid-3 { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 700px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; } .sidebar { display: none; } .main { margin-left: 0; padding: 16px; } }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
  .card h3 { font-size: 13px; color: var(--muted); margin-bottom: 8px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
  .card .big { font-size: 30px; font-weight: 700; }
  .card .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .card .change { font-size: 13px; margin-top: 6px; }
  .change.up { color: var(--green); }
  .change.down { color: var(--red); }

  /* SITE CARDS */
  .site-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px;
    cursor: pointer; transition: transform .15s, border-color .15s; }
  .site-card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .site-card .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .site-card .name { font-weight: 600; font-size: 15px; }
  .site-card .domain { font-size: 12px; color: var(--muted); }
  .site-card .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .site-card .stat { font-size: 12px; color: var(--muted); }
  .site-card .stat b { display: block; color: var(--text); font-size: 18px; font-weight: 700; }
  .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
  .badge-healthy { background: rgba(16,185,129,.15); color: var(--green); }
  .badge-warning { background: rgba(245,158,11,.15); color: var(--yellow); }
  .badge-idle { background: rgba(139,155,180,.15); color: var(--muted); }
  .badge-poor { background: rgba(239,68,68,.15); color: var(--red); }
  .badge-fair { background: rgba(245,158,11,.15); color: var(--yellow); }
  .badge-good { background: rgba(59,130,246,.15); color: var(--blue); }
  .badge-excellent { background: rgba(16,185,129,.15); color: var(--green); }
  .badge-ai { background: rgba(99,102,241,.15); color: var(--accent-2); }
  .issues { margin-top: 10px; font-size: 12px; color: var(--yellow); }
  .issues div { margin-top: 2px; }

  /* TABLES */
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 12px; text-align: left; font-size: 13px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
  tr:hover td { background: var(--panel2); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.pos { color: var(--green); }
  td.neg { color: var(--red); }

  /* CHARTS */
  .chart-wrap { height: 260px; position: relative; }

  /* MODAL */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center;
    justify-content: center; z-index: 100; padding: 20px; }
  .modal-bg.show { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 24px;
    width: 100%; max-width: 480px; }
  .modal h2 { margin-bottom: 16px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field input, .field select, .field textarea { width: 100%; padding: 10px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; font-family: inherit; }
  .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }

  /* HEALTH SCORE */
  .health-ring { display: flex; align-items: center; gap: 24px; }
  .health-ring svg { width: 140px; height: 140px; }
  .health-ring .score { font-size: 36px; font-weight: 700; }
  .health-breakdown { flex: 1; }
  .health-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .health-row:last-child { border-bottom: none; }
  .health-row .label { flex: 1; }
  .health-row .label .name { font-weight: 500; font-size: 14px; }
  .health-row .label .note { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .health-row .bar { width: 80px; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; }
  .health-row .bar .fill { height: 100%; background: var(--green); border-radius: 3px; }
  .health-row .pts { font-size: 12px; color: var(--muted); width: 50px; text-align: right; }

  /* ALERTS */
  .alert-row { padding: 12px; background: var(--panel2); border-radius: 8px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 12px; }
  .alert-row .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--yellow); }
  .alert-row .msg { flex: 1; font-size: 13px; }
  .alert-row .time { color: var(--muted); font-size: 12px; }
  .alert-row.warn .dot { background: var(--yellow); }
  .alert-row.crit .dot { background: var(--red); }

  /* INSTALL SNIPPET */
  .snippet { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 14px;
    font-family: 'SF Mono', 'Monaco', 'Consolas', monospace; font-size: 12px; overflow-x: auto; position: relative; }
  .snippet .copy { position: absolute; top: 8px; right: 8px; padding: 4px 10px; background: var(--accent);
    color: white; border: none; border-radius: 6px; font-size: 11px; cursor: pointer; }
  .snippet code { color: var(--accent-2); }

  /* EMPTY STATE */
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty h2 { color: var(--text); margin-bottom: 8px; }

  /* LOADING */
  .loading { text-align: center; padding: 40px; color: var(--muted); }

  /* AI section */
  .ai-platform-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px;
    background: var(--panel2); border-radius: 8px; margin-bottom: 6px; }
  .ai-platform-row .name { font-weight: 500; }
  .ai-platform-row .stats { color: var(--muted); font-size: 13px; }

  /* SHARE LINK STYLE */
  .share-link-row { display: flex; align-items: center; gap: 10px; padding: 10px; background: var(--panel2);
    border-radius: 8px; margin-bottom: 6px; font-size: 13px; }
  .share-link-row code { flex: 1; font-family: 'SF Mono', 'Monaco', monospace; color: var(--accent-2);
    word-break: break-all; }

  /* MISC */
  .section-title { font-size: 16px; font-weight: 600; margin: 24px 0 12px; }
  .row-toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px;
    background: var(--panel2); border: 1px solid var(--border); font-size: 13px; cursor: pointer; }
  .pill:hover { background: var(--border); }
  .pill.active { background: var(--accent); border-color: var(--accent); color: white; }
  .toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 18px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); display: none; }
  .toast.show { display: block; animation: fadeIn .2s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .public-banner { background: rgba(99,102,241,.15); border: 1px solid var(--accent); color: var(--accent-2);
    padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
</style>
</head>
<body>

<!-- ===== APP ===== -->
<div id="app" class="app">
  <aside class="sidebar">
    <div class="logo"><span class="dot"></span> TrackLight</div>
    <div class="nav-item active" data-view="overview">🏢 Agency Overview <span class="num" id="navSitesCount"></span></div>
    <div class="nav-item" data-view="site">📈 Site Details</div>
    <div class="nav-item" data-view="ai">🤖 AI Traffic</div>
    <div class="nav-item" data-view="health">💚 Health Scores</div>
    <div class="nav-section">Manage</div>
    <div class="nav-item" data-view="sites">🌐 Sites</div>
    <div class="nav-item" data-view="alerts">🔔 Alerts <span class="num" id="navAlertCount"></span></div>
    <div class="nav-item" data-view="share">🔗 Share Links</div>
    <div class="nav-item" data-view="install">⚙️ Install Code</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1 id="viewTitle">Agency Overview</h1>
      <div class="right" id="topbarRight"></div>
    </div>
    <div id="content"></div>
  </main>
</div>

<!-- ===== PUBLIC CLIENT REPORT (shown when ?token=xxx is in URL) ===== -->
<div id="publicReport" style="display:none; padding: 24px 32px; max-width: 1200px; margin: 0 auto;"></div>

<!-- ===== MODAL ===== -->
<div id="modal" class="modal-bg">
  <div class="modal" id="modalBody"></div>
</div>

<!-- ===== TOAST ===== -->
<div id="toast" class="toast"></div>

<script>
//==================================================================
// STATE
//==================================================================
const state = {
  sites: [],
  overview: [],
  currentSite: null,
  currentView: 'overview',
  shareToken: null,
};

//==================================================================
// API HELPERS
//==================================================================
async function api(path, opts = {}) {
  const o = { credentials: 'include', headers: { 'Content-Type': 'application/json' }, ...opts };
  if (o.body && typeof o.body !== 'string') o.body = JSON.stringify(o.body);

  // Append share token if present
  let url = path;
  if (state.shareToken && path.startsWith('/api/')) {
    url += (path.includes('?') ? '&' : '?') + 'token=' + state.shareToken;
  }

  const r = await fetch(url, o);
  if (r.status === 401) {
    if (state.shareToken) throw new Error('Share link expired or invalid');
    throw new Error('unauthorized');
  }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'request failed');
  return data;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function fmtNum(n) {
  if (n >= 1e6) return (n/1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(1) + 'k';
  return String(n || 0);
}

function fmtRelativeTime(iso) {
  if (!iso) return 'never';
  const ms = Date.now() - new Date(iso).getTime();
  if (ms < 60000) return 'just now';
  if (ms < 3600000) return Math.floor(ms/60000) + 'm ago';
  if (ms < 86400000) return Math.floor(ms/3600000) + 'h ago';
  return Math.floor(ms/86400000) + 'd ago';
}

//==================================================================
// VIEW SWITCHING (no auth — open access)
//==================================================================
function showApp() {
  document.getElementById('app').style.display = 'block';
  document.getElementById('publicReport').style.display = 'none';
}

function showPublic() {
  document.getElementById('app').style.display = 'none';
  document.getElementById('publicReport').style.display = 'block';
}

//==================================================================
// NAVIGATION
//==================================================================
document.querySelectorAll('.nav-item[data-view]').forEach(el => {
  el.onclick = () => {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    el.classList.add('active');
    const view = el.dataset.view;
    state.currentView = view;
    renderView(view);
  };
});

async function renderView(view) {
  const titles = { overview: 'Agency Overview', site: 'Site Details', ai: 'AI Traffic',
    health: 'Health Scores', sites: 'Manage Sites', alerts: 'Alerts', share: 'Share Links',
    install: 'Install Code' };
  document.getElementById('viewTitle').textContent = titles[view] || 'TrackLight';
  document.getElementById('topbarRight').innerHTML = '';
  const c = document.getElementById('content');
  c.innerHTML = '<div class="loading">Loading…</div>';
  try {
    if (view === 'overview') await renderOverview();
    else if (view === 'site') await renderSite();
    else if (view === 'ai') await renderAITraffic();
    else if (view === 'health') await renderHealth();
    else if (view === 'sites') await renderSitesManage();
    else if (view === 'alerts') await renderAlerts();
    else if (view === 'share') await renderShareLinks();
    else if (view === 'install') renderInstall();
  } catch (e) {
    c.innerHTML = `<div class="empty"><h2>Error</h2><p>${e.message}</p></div>`;
  }
}

//==================================================================
// VIEW: AGENCY OVERVIEW
//==================================================================
async function loadOverview() {
  state.sites = await api('/api/sites');
  state.overview = await api('/api/overview');
  document.getElementById('navSitesCount').textContent = state.sites.length;
  if (state.sites.length && !state.currentSite) state.currentSite = state.sites[0].id;
  // load alert count
  try { const h = await api('/api/alert-history'); document.getElementById('navAlertCount').textContent = h.filter(a=>!a.acknowledged).length || ''; } catch {}
  renderView('overview');
}

async function renderOverview() {
  const c = document.getElementById('content');
  state.overview = await api('/api/overview');

  if (state.overview.length === 0 || (state.overview.length === 1 && state.overview[0].id === 'demo' && state.overview[0].status === 'idle')) {
    c.innerHTML = `
      <div class="empty">
        <h2>Welcome to TrackLight 👋</h2>
        <p style="margin: 12px 0 20px;">Add your first client site to get started.</p>
        <button class="btn btn-primary" onclick="openAddSite()">+ Add Site</button>
        <p style="margin-top: 30px;">Or try with sample data:</p>
        <button class="btn" onclick="seedDemo()">Load demo data</button>
      </div>`;
    return;
  }

  // Summary header
  const totalToday = state.overview.reduce((a, s) => a + s.todayVisitors, 0);
  const totalOnline = state.overview.reduce((a, s) => a + s.online, 0);
  const totalConv = state.overview.reduce((a, s) => a + s.conversions7d, 0);
  const warningSites = state.overview.filter(s => s.status === 'warning').length;

  const cards = `
    <div class="grid grid-4" style="margin-bottom: 24px;">
      <div class="card"><h3>Sites Tracked</h3><div class="big">${state.overview.length}</div></div>
      <div class="card"><h3>Online Right Now</h3><div class="big" style="color: var(--green)">${totalOnline}</div></div>
      <div class="card"><h3>Visitors Today</h3><div class="big">${fmtNum(totalToday)}</div></div>
      <div class="card"><h3>Conversions (7d)</h3><div class="big">${fmtNum(totalConv)}</div></div>
    </div>
    ${warningSites > 0 ? `<div class="public-banner">⚠️ ${warningSites} site${warningSites>1?'s':''} need${warningSites>1?'':'s'} attention</div>` : ''}
    <div class="section-title">All Sites</div>
    <div class="grid grid-3" id="siteGrid"></div>`;

  c.innerHTML = cards;

  const grid = document.getElementById('siteGrid');
  state.overview.forEach(s => {
    const card = document.createElement('div');
    card.className = 'site-card';
    card.onclick = () => { state.currentSite = s.id; document.querySelector('.nav-item[data-view=site]').click(); };
    const trendIcon = s.trend > 0 ? '↑' : s.trend < 0 ? '↓' : '→';
    const trendClass = s.trend > 0 ? 'up' : s.trend < 0 ? 'down' : '';
    card.innerHTML = `
      <div class="head">
        <div>
          <div class="name">${s.name}</div>
          <div class="domain">${s.domain || s.id}</div>
        </div>
        <span class="badge badge-${s.status}">${s.status}</span>
      </div>
      <div class="stats">
        <div class="stat"><b>${fmtNum(s.todayVisitors)}</b>Visitors today</div>
        <div class="stat"><b style="color: var(--green)">${s.online}</b>Online now</div>
        <div class="stat"><b>${fmtNum(s.conversions7d)}</b>Conversions 7d</div>
        <div class="stat"><b class="${trendClass}" style="color: ${s.trend > 0 ? 'var(--green)' : s.trend < 0 ? 'var(--red)' : 'var(--muted)'}">${trendIcon} ${Math.abs(s.trend)}%</b>vs yesterday</div>
      </div>
      ${s.issues.length ? `<div class="issues">⚠️ ${s.issues.map(i=>`<div>• ${i}</div>`).join('')}</div>` : ''}
      <div style="margin-top: 10px; font-size: 11px; color: var(--muted)">Last event: ${fmtRelativeTime(s.lastEvent)}</div>
    `;
    grid.appendChild(card);
  });
}

//==================================================================
// VIEW: SITE DETAILS
//==================================================================
async function renderSite() {
  const c = document.getElementById('content');
  if (!state.currentSite) state.currentSite = state.sites[0]?.id;
  if (!state.currentSite) { c.innerHTML = '<div class="empty"><p>Add a site first</p></div>'; return; }

  // Site picker
  const picker = `
    <div class="row-toolbar">
      <select id="sitePicker" class="btn">${state.sites.map(s => `<option value="${s.id}" ${s.id===state.currentSite?'selected':''}>${s.name}</option>`).join('')}</select>
      <span style="color: var(--muted); font-size: 13px;">Last 30 days</span>
    </div>`;

  const stats = await api(`/api/stats?siteId=${state.currentSite}&days=30`);
  const realtime = await api(`/api/realtime?siteId=${state.currentSite}`);
  const movers = await api(`/api/page-movers?siteId=${state.currentSite}`);

  if (stats.pageviews === 0) {
    c.innerHTML = picker + `
      <div class="empty">
        <h2>No data yet</h2>
        <p style="margin: 12px 0 20px;">Install the tracking snippet on your site to start collecting data.</p>
        <button class="btn btn-primary" onclick="document.querySelector('.nav-item[data-view=install]').click()">Get install code →</button>
        ${state.currentSite === 'demo' ? '<p style="margin-top:30px;">Or:</p><button class="btn" onclick="seedDemo()">Load sample demo data</button>' : ''}
      </div>`;
    bindSitePicker();
    return;
  }

  // KPI cards
  const kpis = `
    <div class="grid grid-4" style="margin-bottom: 16px;">
      <div class="card"><h3>Visitors (30d)</h3><div class="big">${fmtNum(stats.visitors)}</div><div class="sub">${fmtNum(stats.pageviews)} pageviews</div></div>
      <div class="card"><h3>Conversion Rate</h3><div class="big">${stats.conversionRate}%</div><div class="sub">${fmtNum(stats.conversions)} conversions</div></div>

async function renderHealth() {
  const c = document.getElementById('content');
  c.innerHTML = '<div class="loading">Calculating health scores…</div>';

  const sites = state.sites;
  if (sites.length === 0) {
    c.innerHTML = '<div class="empty"><p>Add sites first</p></div>';
    return;
  }

  let html = '<div class="grid grid-2">';
  for (const site of sites) {
    try {
      const h = await api(`/api/health-score?siteId=${site.id}`);
      const color = h.score >= 85 ? '#10b981' : h.score >= 70 ? '#3b82f6' : h.score >= 50 ? '#f59e0b' : '#ef4444';
      const circ = 2 * Math.PI * 60;
      const dash = (h.score / 100) * circ;
      html += `
        <div class="card">
          <h3>${site.name}</h3>
          <div class="health-ring" style="margin-top: 10px;">
            <svg viewBox="0 0 140 140">
              <circle cx="70" cy="70" r="60" fill="none" stroke="#243047" stroke-width="14"/>
              <circle cx="70" cy="70" r="60" fill="none" stroke="${color}" stroke-width="14"
                stroke-dasharray="${dash} ${circ}" stroke-linecap="round" transform="rotate(-90 70 70)"/>
              <text x="70" y="78" text-anchor="middle" fill="${color}" font-size="34" font-weight="700">${h.score}</text>
            </svg>
            <div class="health-breakdown">
              <span class="badge badge-${h.status}">${h.status}</span>
              <div style="margin-top: 12px;">
                ${h.breakdown.map(b => `
                  <div class="health-row">
                    <div class="label">
                      <div class="name">${b.label}</div>
                      <div class="note">${b.note}</div>
                    </div>
                    <div class="bar"><div class="fill" style="width:${(b.score/b.max)*100}%;background:${color}"></div></div>
                    <div class="pts">${b.score}/${b.max}</div>
                  </div>`).join('')}
              </div>
            </div>
          </div>
        </div>`;
    } catch (e) {
      html += `<div class="card"><h3>${site.name}</h3><p style="color: var(--red)">Error: ${e.message}</p></div>`;
    }
  }
  html += '</div>';
  c.innerHTML = html;
}

async function renderAlerts() {
  const c = document.getElementById('content');
  document.getElementById('topbarRight').innerHTML = `
    <button class="btn" onclick="evaluateAlertsNow()">Run check now</button>
    <button class="btn btn-primary" onclick="openAddAlert()">+ New Alert</button>`;

  const [rules, history] = await Promise.all([api('/api/alerts'), api('/api/alert-history')]);

  let html = '';
  if (history.length) {
    html += '<div class="section-title">Recent Alerts</div>';
    history.forEach(h => {
      html += `<div class="alert-row ${h.severity === 'critical' ? 'crit' : 'warn'}">
        <span class="dot"></span>
        <span class="msg"><b>${h.site_name || 'All sites'}</b> — ${h.message}</span>
        <span class="time">${fmtRelativeTime(h.triggered_at)}</span>
        ${!h.acknowledged ? `<button class="btn" style="padding:4px 10px;font-size:11px" onclick="ackAlert(${h.id})">Acknowledge</button>` : '<span class="badge badge-good">acked</span>'}
      </div>`;
    });
  }

  html += '<div class="section-title">Alert Rules</div>';
  if (rules.length === 0) {
    html += '<div class="card"><p style="color:var(--muted)">No alert rules yet. Add one to monitor your sites automatically.</p></div>';
  } else {
    html += '<div class="card"><table><thead><tr><th>Name</th><th>Site</th><th>Rule</th><th>Threshold</th><th>Window</th><th>Status</th><th></th></tr></thead><tbody>';
    rules.forEach(r => {
      html += `<tr>
        <td><b>${r.name}</b></td>
        <td>${r.site_name || 'All sites'}</td>
        <td>${ruleTypeLabel(r.rule_type)}</td>
        <td>${r.threshold || '-'}</td>
        <td>${r.window_hours}h</td>
        <td>${r.enabled ? '<span class="badge badge-good">enabled</span>' : '<span class="badge badge-idle">disabled</span>'}</td>
        <td style="text-align:right"><button class="btn btn-danger" onclick="deleteAlert('${r.id}')">Delete</button></td>
      </tr>`;
    });
    html += '</tbody></table></div>';
  }
  c.innerHTML = html;
}

function ruleTypeLabel(t) {
  return { form_breakage: 'Form starts but no completes', traffic_drop: 'Traffic drops by %', no_conversions: 'No conversions' }[t] || t;
}

function openAddAlert() {
  const b = document.getElementById('modalBody');
  b.innerHTML = `

    <div class="field"><label>Name</label><input id="al_name" type="text" placeholder="e.g. Pilchard form broken" /></div>
    <div class="field"><label>Site (leave blank for all sites)</label>

    <div class="field"><label>Rule type</label>
      <select id="al_type">

    <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitAddAlert()">Create</button></div>`;
  document.getElementById('modal').classList.add('show');

async function renderShareLinks() {
  const c = document.getElementById('content');

        <li>Click heatmaps</li>
        <li>Time on page, scroll depth</li>
        <li>SPA route changes (React, Vue, Next.js)</li>
      </ul>
      <p style="color:var(--muted);font-size:12px;margin-top:12px;">
        To track a custom conversion: <code style="background:var(--bg);padding:2px 6px;border-radius:4px">TrackLight.track('conversion', { value: 99 })</code>
      </p>
    </div>`;
  bindSitePicker();
}

//==================================================================
// PUBLIC REPORT VIEW (shown when ?token=xxx is in URL)
//==================================================================
async function renderPublicReport(token) {
  state.shareToken = token;
  document.getElementById('publicReport').style.display = 'block';
  const c = document.getElementById('publicReport');
  c.innerHTML = '<div class="loading">Loading report…</div>';

  try {
    // The share token defines which site we read; backend enforces this
    // We need to discover the site_id — easiest: try common endpoints and let backend validate
    // Since the share-link endpoint requires siteId param, we need to know it.
    // Let's add a small endpoint to resolve: try fetching stats with placeholder, server will reject; instead, decode from URL.
    // For now we use a separate /api/share-resolve endpoint approach — but to avoid breaking, we ask the share endpoint to return the site_id.
    // We'll do it via a lightweight call: try overview-style endpoint with no siteId — backend gives us the share's site.
    // Quick approach: hit a special endpoint /api/share-info that returns the site for a token.
    const info = await fetch(`/api/share-info?token=${token}`).then(r => r.ok ? r.json() : Promise.reject(new Error('Invalid or expired link')));
    const siteId = info.siteId;
    const siteName = info.siteName || siteId;

    const [stats, health, ai, overview] = await Promise.all([
      api(`/api/stats?siteId=${siteId}&days=30`),
      api(`/api/health-score?siteId=${siteId}`),
      api(`/api/ai-traffic?siteId=${siteId}&days=30`),
      api(`/api/realtime?siteId=${siteId}`),
    ]);

    const color = health.score >= 85 ? '#10b981' : health.score >= 70 ? '#3b82f6' : health.score >= 50 ? '#f59e0b' : '#ef4444';
    const circ = 2 * Math.PI * 60;
    const dash = (health.score / 100) * circ;

    c.innerHTML = `
      <div style="margin-bottom: 24px;">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
          <div>
            <div style="color:var(--muted);font-size:13px;">Analytics report</div>
            <h1 style="font-size: 28px; margin-top: 2px;">${siteName}</h1>
          </div>
          <div style="color:var(--muted);font-size:13px;">Last 30 days · Generated ${new Date().toLocaleDateString()}</div>
        </div>
      </div>

      <div class="card" style="margin-bottom: 20px;">
        <div class="health-ring">
          <svg viewBox="0 0 140 140">
            <circle cx="70" cy="70" r="60" fill="none" stroke="#243047" stroke-width="14"/>
            <circle cx="70" cy="70" r="60" fill="none" stroke="${color}" stroke-width="14"
              stroke-dasharray="${dash} ${circ}" stroke-linecap="round" transform="rotate(-90 70 70)"/>
            <text x="70" y="78" text-anchor="middle" fill="${color}" font-size="34" font-weight="700">${health.score}</text>
          </svg>
          <div class="health-breakdown">
            <h3 style="font-size: 14px; color: var(--muted); margin-bottom: 8px;">SITE HEALTH SCORE</h3>
            <div style="font-size: 16px; font-weight: 600; margin-bottom: 12px; text-transform: capitalize;">${health.status}</div>
            ${health.breakdown.map(b => `<div class="health-row">
              <div class="label"><div class="name">${b.label}</div><div class="note">${b.note}</div></div>
              <div class="bar"><div class="fill" style="width:${(b.score/b.max)*100}%;background:${color}"></div></div>
              <div class="pts">${b.score}/${b.max}</div>
            </div>`).join('')}
          </div>
        </div>
      </div>

      <div class="grid grid-4" style="margin-bottom: 20px;">
        <div class="card"><h3>Visitors (30d)</h3><div class="big">${fmtNum(stats.visitors)}</div></div>
        <div class="card"><h3>Conversions</h3><div class="big">${stats.conversions}</div><div class="sub">${stats.conversionRate}% rate</div></div>
        <div class="card"><h3>AI Traffic</h3><div class="big" style="color: var(--accent-2)">${fmtNum(ai.visitors)}</div><div class="sub">${ai.byPlatform.length} platform${ai.byPlatform.length===1?'':'s'}</div></div>
        <div class="card"><h3>Bounce Rate</h3><div class="big">${stats.bounceRate}%</div></div>
      </div>

      <div class="grid grid-2" style="margin-bottom: 20px;">
        <div class="card"><h3>Daily Visitors</h3><div class="chart-wrap"><canvas id="pubDaily"></canvas></div></div>
        <div class="card"><h3>Traffic Sources</h3><div class="chart-wrap"><canvas id="pubSources"></canvas></div></div>
      </div>

      <div class="card" style="margin-bottom: 20px;">
        <h3>Top Pages</h3>
        <table><thead><tr><th>Page</th><th class="num">Views</th></tr></thead><tbody>
          ${stats.topPages.slice(0,10).map(p=>`<tr><td>${p.page}</td><td class="num">${fmtNum(p.views)}</td></tr>`).join('')}
        </tbody></table>
      </div>

      ${ai.byPlatform.length ? `<div class="card">
        <h3>🤖 AI Traffic Breakdown</h3>
        ${ai.byPlatform.map(p=>`<div class="ai-platform-row">
          <span><span class="badge badge-ai">AI</span> &nbsp;<b>${p.platform}</b></span>
          <span class="stats">${fmtNum(p.visitors)} visitors · ${p.conversions} conversions</span>
        </div>`).join('')}
      </div>` : ''}

      <div style="text-align: center; padding: 30px 0; color: var(--muted); font-size: 12px;">
        Powered by TrackLight · Read-only public report
      </div>`;

    new Chart(document.getElementById('pubDaily'), {
      type: 'line',
      data: { labels: stats.daily.map(d=>d.date.slice(5)), datasets: [{
        label: 'Visitors', data: stats.daily.map(d=>d.visitors),
        borderColor: '#6366f1', backgroundColor: 'rgba(99,102,241,.1)', fill: true, tension: 0.3, pointRadius: 0 }]},
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
        scales: { x: { ticks: { color: '#8b9bb4', maxRotation: 0, autoSkipPadding: 12 }, grid: { display: false } },
                  y: { ticks: { color: '#8b9bb4' }, grid: { color: '#243047' } } } }
    });

    new Chart(document.getElementById('pubSources'), {
      type: 'doughnut',
      data: { labels: Object.keys(stats.sources), datasets: [{
        data: Object.values(stats.sources),
        backgroundColor: ['#6366f1','#10b981','#f59e0b','#3b82f6','#ef4444','#8b5cf6','#ec4899','#14b8a6','#f97316'],
        borderWidth: 0 }]},
      options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'right', labels: { color: '#e8edf7', boxWidth: 12, font: { size: 12 } } } } }
    });
  } catch (e) {
    c.innerHTML = `<div class="empty"><h2>Report unavailable</h2><p>${e.message}</p></div>`;
  }
}

//==================================================================
// BOOTSTRAP
//==================================================================
(async () => {
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  if (token) {
    showPublic();
    renderPublicReport(token);
    return;
  }

  // Open access — show the app immediately
  showApp();
  try { await loadOverview(); } catch (e) { console.error(e); }
})();

// Close modal on background click
document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});
</script>
</body>
</html>
