<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrackLight Analytics</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f8f9fb;
  --surface: #ffffff;
  --border: rgba(0,0,0,0.08);
  --border-md: rgba(0,0,0,0.13);
  --text: #111827;
  --muted: #6b7280;
  --hint: #9ca3af;
  --accent: #1a6bff;
  --accent-dim: rgba(26,107,255,0.08);
  --red: #dc2626;
  --green: #16a34a;
  --amber: #d97706;
  --radius: 10px;
  --radius-sm: 7px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1117;
    --surface: #1a1d26;
    --border: rgba(255,255,255,0.07);
    --border-md: rgba(255,255,255,0.12);
    --text: #f3f4f6;
    --muted: #9ca3af;
    --hint: #6b7280;
  }
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; height: 100vh; overflow: hidden; display: flex; }

/* Sidebar */
.sidebar { width: 210px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
.logo { padding: 18px 16px 14px; border-bottom: 1px solid var(--border); }
.logo-row { display: flex; align-items: center; gap: 9px; }
.logo-icon { width: 28px; height: 28px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.logo-icon i { color: #fff; font-size: 15px; }
.logo-name { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
.logo-tag { font-size: 10px; color: var(--hint); margin-top: 1px; }

.nav-section { font-size: 10px; font-weight: 600; color: var(--hint); letter-spacing: 0.6px; text-transform: uppercase; padding: 14px 16px 4px; }
.nav-item { display: flex; align-items: center; gap: 9px; padding: 7px 16px; font-size: 13px; color: var(--muted); cursor: pointer; border-left: 2px solid transparent; transition: all 0.1s; }
.nav-item:hover { background: var(--bg); color: var(--text); }
.nav-item.active { color: var(--accent); border-left-color: var(--accent); background: var(--accent-dim); font-weight: 500; }
.nav-item i { font-size: 16px; }

.site-pill { margin: auto 12px 14px; padding: 9px 11px; border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; }
.site-pill:hover { border-color: var(--accent); }
.site-pill-name { font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 5px; }
.site-pill-url { font-size: 11px; color: var(--hint); margin-top: 2px; }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; display: inline-block; animation: blink 1.5s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* Main */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 11px 22px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.topbar-left { display: flex; align-items: center; gap: 12px; }
.page-title { font-size: 15px; font-weight: 600; }
.online-badge { display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 500; color: var(--green); background: #dcfce7; padding: 3px 9px; border-radius: 20px; }
.topbar-right { display: flex; align-items: center; gap: 8px; }
.tb-btn { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); cursor: pointer; transition: all 0.1s; }
.tb-btn:hover { border-color: var(--border-md); color: var(--text); }
.tb-btn i { font-size: 14px; }
.tb-btn.primary { color: var(--accent); border-color: rgba(26,107,255,0.25); background: var(--accent-dim); }
.tb-btn.primary:hover { background: rgba(26,107,255,0.14); }
select.tb-btn { font-family: inherit; }

/* Scrollable content */
.content { flex: 1; overflow-y: auto; padding: 18px 22px; display: flex; flex-direction: column; gap: 16px; }

/* Metrics row */
.metrics { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.metric { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
.metric-lbl { font-size: 11px; color: var(--hint); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 7px; }
.metric-val { font-size: 26px; font-weight: 600; line-height: 1; letter-spacing: -0.5px; }
.metric-delta { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; margin-top: 6px; padding: 2px 6px; border-radius: 20px; }
.up { background: #dcfce7; color: var(--green); }
.down { background: #fee2e2; color: var(--red); }
.warn { background: #fef3c7; color: var(--amber); }

/* Cards */
.row2 { display: grid; grid-template-columns: 3fr 2fr; gap: 14px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.card-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.card-title { font-size: 13px; font-weight: 600; }
.card-action { font-size: 11px; color: var(--accent); cursor: pointer; }

/* Tabs */
.tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
.tab { font-size: 12px; padding: 5px 12px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }

/* Chart */
.chart-wrap { position: relative; height: 180px; }

/* Sessions */
.sessions { display: flex; flex-direction: column; }
.sess-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
.sess-row:last-child { border-bottom: none; }
.sess-av { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; }
.sess-pg { font-size: 12px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
.sess-info { font-size: 11px; color: var(--hint); margin-top: 1px; }
.badge { font-size: 10px; padding: 2px 7px; border-radius: 20px; flex-shrink: 0; white-space: nowrap; }
.b-green { background: #dcfce7; color: var(--green); }
.b-red { background: #fee2e2; color: var(--red); }
.b-gray { background: var(--bg); color: var(--muted); }
.b-amber { background: #fef3c7; color: var(--amber); }

/* Heatmap */
.hm-outer { position: relative; border-radius: var(--radius-sm); overflow: hidden; background: var(--bg); border: 1px solid var(--border); height: 200px; }
.hm-browser { height: 22px; background: var(--surface); display: flex; align-items: center; padding: 0 8px; gap: 4px; border-bottom: 1px solid var(--border); }
.hm-dot { width: 6px; height: 6px; border-radius: 50%; }
.hm-url { font-size: 10px; color: var(--hint); margin-left: 4px; }
.hm-body { position: relative; height: calc(200px - 22px); overflow: hidden; }
.hm-page-mock { padding: 8px 10px; display: flex; flex-direction: column; gap: 5px; }
.hm-line { height: 6px; border-radius: 3px; background: var(--border); }
.hm-spot { position: absolute; border-radius: 50%; pointer-events: none; mix-blend-mode: multiply; }

/* Funnel */
.funnel-steps { display: flex; flex-direction: column; gap: 8px; }
.fn-step {}
.fn-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px; }
.fn-label { color: var(--muted); }
.fn-count { font-weight: 500; }
.fn-bar-bg { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; border: 1px solid var(--border); }
.fn-bar { height: 100%; border-radius: 4px; }
.fn-drop { font-size: 10px; color: var(--hint); text-align: right; margin-top: 1px; }

/* Sources */
.src-list { display: flex; flex-direction: column; gap: 8px; }
.src-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.src-lbl { width: 90px; color: var(--muted); flex-shrink: 0; font-size: 11px; }
.src-track { flex: 1; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; }
.src-fill { height: 100%; border-radius: 3px; }
.src-pct { width: 34px; text-align: right; font-size: 11px; font-weight: 500; }

/* Top pages */
.pages-list { display: flex; flex-direction: column; gap: 2px; }
.pg-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 12px; border-bottom: 1px solid var(--border); }
.pg-row:last-child { border-bottom: none; }
.pg-path { flex: 1; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: monospace; font-size: 11px; }
.pg-bar-w { width: 80px; }
.pg-bar-bg { height: 5px; background: var(--bg); border-radius: 3px; overflow: hidden; }
.pg-bar-fill { height: 100%; border-radius: 3px; background: var(--accent); opacity: 0.6; }
.pg-num { width: 40px; text-align: right; color: var(--muted); }

/* Annotations */
.ann-list { display: flex; flex-direction: column; gap: 7px; }
.ann-item { display: flex; align-items: flex-start; gap: 9px; padding: 8px 10px; border-radius: var(--radius-sm); background: var(--bg); border-left: 3px solid var(--accent); }
.ann-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; margin-top: 4px; }
.ann-text { font-size: 12px; line-height: 1.4; }
.ann-date { font-size: 11px; color: var(--hint); margin-top: 2px; }
.ann-form { display: flex; gap: 6px; margin-top: 8px; }
.ann-input { flex: 1; font-size: 12px; padding: 6px 9px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); font-family: inherit; outline: none; }
.ann-input:focus { border-color: var(--accent); }
.ann-save { font-size: 12px; padding: 6px 12px; border-radius: var(--radius-sm); background: var(--accent); color: #fff; border: none; cursor: pointer; font-family: inherit; flex-shrink: 0; }

/* Embed snippet */
.snippet-box { background: #1e2335; border-radius: var(--radius-sm); padding: 12px 14px; font-family: monospace; font-size: 12px; color: #a9b4cc; line-height: 1.6; position: relative; overflow-x: auto; white-space: pre; }
.snippet-copy { position: absolute; top: 8px; right: 8px; font-size: 11px; padding: 3px 8px; border-radius: 4px; background: rgba(255,255,255,0.1); color: #a9b4cc; border: none; cursor: pointer; font-family: inherit; }
.snippet-copy:hover { background: rgba(255,255,255,0.2); color: #fff; }
.tok-tag { color: #7dd3fc; }
.tok-attr { color: #86efac; }
.tok-val { color: #fca5a5; }

/* Realtime pulse */
.rt-bar { display: flex; gap: 3px; align-items: flex-end; height: 30px; margin-bottom: 10px; }
.rt-col { width: 6px; background: var(--accent); border-radius: 2px; opacity: 0.7; transition: height 0.5s; }

/* Loading overlay */
#loading { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 100; flex-direction: column; gap: 12px; }
.spin { width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#loading p { font-size: 13px; color: var(--muted); }

/* Scrollbar */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-md); border-radius: 3px; }
</style>
</head>
<body>

<div id="loading">
  <div class="logo-icon" style="width:40px;height:40px;border-radius:12px;background:#1a6bff;display:flex;align-items:center;justify-content:center;">
    <i class="ti ti-activity" style="font-size:22px;color:#fff;"></i>
  </div>
  <div class="spin"></div>
  <p>Loading TrackLight…</p>
</div>

<div class="sidebar">
  <div class="logo">
    <div class="logo-row">
      <div class="logo-icon"><i class="ti ti-activity"></i></div>
      <div>
        <div class="logo-name">TrackLight</div>
        <div class="logo-tag">Analytics</div>
      </div>
    </div>
  </div>

  <span class="nav-section">Insights</span>
  <div class="nav-item active" data-view="dashboard"><i class="ti ti-layout-dashboard"></i> Dashboard</div>
  <div class="nav-item" data-view="realtime"><i class="ti ti-radio"></i> Real-time</div>
  <div class="nav-item" data-view="heatmap"><i class="ti ti-flame"></i> Heatmaps</div>
  <div class="nav-item" data-view="recordings"><i class="ti ti-player-play"></i> Recordings</div>

  <span class="nav-section">Conversion</span>
  <div class="nav-item" data-view="funnel"><i class="ti ti-filter"></i> Funnels</div>
  <div class="nav-item" data-view="pages"><i class="ti ti-file-analytics"></i> Top pages</div>
  <div class="nav-item" data-view="sources"><i class="ti ti-antenna"></i> Traffic sources</div>

  <span class="nav-section">Tools</span>
  <div class="nav-item" data-view="annotations"><i class="ti ti-bookmark"></i> Annotations</div>
  <div class="nav-item" data-view="install"><i class="ti ti-code"></i> Install snippet</div>
  <div class="nav-item" data-view="settings"><i class="ti ti-settings"></i> Settings</div>

  <div class="site-pill">
    <div class="site-pill-name"><span class="live-dot"></span> <span id="siteName">yourdomain.com</span></div>
    <div class="site-pill-url" id="siteId">Site ID: demo</div>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <span class="page-title" id="viewTitle">Dashboard</span>
      <span class="online-badge"><span class="live-dot"></span> <span id="onlineCount">—</span> online</span>
    </div>
    <div class="topbar-right">
      <select class="tb-btn" id="daySelect" onchange="loadStats()">
        <option value="7">Last 7 days</option>
        <option value="30" selected>Last 30 days</option>
        <option value="90">Last 90 days</option>
      </select>
      <button class="tb-btn" onclick="loadStats()"><i class="ti ti-refresh"></i> Refresh</button>
      <button class="tb-btn primary" onclick="showView('install')"><i class="ti ti-code"></i> Add to site</button>
    </div>
  </div>

  <div class="content" id="content"></div>
</div>

<script>
const API = '';
let stats = null;
let heatmapData = [];
let annotations = [];
let currentView = 'dashboard';
let mainChartInst = null;

// ── Bootstrap ──────────────────────────────────────────────────────────────
async function boot() {
  await seedIfEmpty();
  await loadStats();
  document.getElementById('loading').style.display = 'none';
  setInterval(tickOnline, 4000);
  setInterval(() => { if (currentView === 'realtime') renderView(); }, 5000);
}

async function seedIfEmpty() {
  try {
    const r = await fetch(API + '/api/stats?siteId=demo&days=7');
    const d = await r.json();
    if (d.visitors === 0) {
      await fetch(API + '/api/seed', { method: 'POST' });
    }
  } catch(e) {}
}

async function loadStats() {
  const days = document.getElementById('daySelect').value;
  try {
    const [sR, hR, aR] = await Promise.all([
      fetch(API + `/api/stats?siteId=demo&days=${days}`).then(r => r.json()),
      fetch(API + `/api/heatmap?siteId=demo`).then(r => r.json()),
      fetch(API + `/api/annotations?siteId=demo`).then(r => r.json()),
    ]);
    stats = sR;
    heatmapData = hR;
    annotations = aR;
    renderView();
  } catch(e) {
    document.getElementById('content').innerHTML = '<p style="color:var(--muted);padding:20px">Could not load data. Make sure the server is running.</p>';
  }
}

function tickOnline() {
  const n = Math.floor(4 + Math.random() * 18);
  document.getElementById('onlineCount').textContent = n;
}
tickOnline();

// ── Navigation ─────────────────────────────────────────────────────────────
document.querySelectorAll('.nav-item').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    el.classList.add('active');
    showView(el.dataset.view);
  });
});

function showView(v) {
  currentView = v;
  const titles = { dashboard:'Dashboard', realtime:'Real-time', heatmap:'Heatmaps', recordings:'Session recordings', funnel:'Conversion funnel', pages:'Top pages', sources:'Traffic sources', annotations:'Annotations', install:'Install snippet', settings:'Settings' };
  document.getElementById('viewTitle').textContent = titles[v] || v;
  const nav = document.querySelector(`.nav-item[data-view="${v}"]`);
  if (nav) { document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active')); nav.classList.add('active'); }
  renderView();
}

function renderView() {
  if (!stats) return;
  const c = document.getElementById('content');
  if (currentView === 'dashboard') c.innerHTML = dashboardHTML();
  else if (currentView === 'realtime') c.innerHTML = realtimeHTML();
  else if (currentView === 'heatmap') c.innerHTML = heatmapHTML();
  else if (currentView === 'recordings') c.innerHTML = recordingsHTML();
  else if (currentView === 'funnel') c.innerHTML = funnelHTML();
  else if (currentView === 'pages') c.innerHTML = pagesHTML();
  else if (currentView === 'sources') c.innerHTML = sourcesHTML();
  else if (currentView === 'annotations') c.innerHTML = annotationsHTML();
  else if (currentView === 'install') c.innerHTML = installHTML();
  else if (currentView === 'settings') c.innerHTML = settingsHTML();
  afterRender();
}

// ── Views ──────────────────────────────────────────────────────────────────

function fmt(n) { return (n||0).toLocaleString(); }
function pct(a, b) { return b ? Math.round((a/b)*100) : 0; }
function fmtDur(s) { if (!s) return '0s'; if (s < 60) return s + 's'; return Math.floor(s/60) + 'm ' + (s%60) + 's'; }

function dashboardHTML() {
  const s = stats;
  return `
  <div class="metrics">
    <div class="metric">
      <div class="metric-lbl">Unique visitors</div>
      <div class="metric-val">${fmt(s.visitors)}</div>
      <div class="metric-delta up"><i class="ti ti-arrow-up" style="font-size:10px"></i> +18% vs prev</div>
    </div>
    <div class="metric">
      <div class="metric-lbl">Sessions</div>
      <div class="metric-val">${fmt(s.sessions)}</div>
      <div class="metric-delta up"><i class="ti ti-arrow-up" style="font-size:10px"></i> +12%</div>
    </div>
    <div class="metric">
      <div class="metric-lbl">Bounce rate</div>
      <div class="metric-val">${s.bounceRate}%</div>
      <div class="metric-delta ${s.bounceRate > 60 ? 'down' : 'up'}"><i class="ti ti-arrow-${s.bounceRate > 60 ? 'up' : 'down'}" style="font-size:10px"></i> ${s.bounceRate > 60 ? 'High' : 'Healthy'}</div>
    </div>
    <div class="metric">
      <div class="metric-lbl">Avg. duration</div>
      <div class="metric-val">${fmtDur(s.avgDuration)}</div>
      <div class="metric-delta up"><i class="ti ti-clock" style="font-size:10px"></i> Avg scroll ${s.avgScrollDepth}%</div>
    </div>
    <div class="metric">
      <div class="metric-lbl">Conversions</div>
      <div class="metric-val">${fmt(s.conversions)}</div>
      <div class="metric-delta ${s.conversions === 0 ? 'down' : 'up'}">${s.conversions === 0 ? '⚠ Check form setup' : '✓ Goal tracking on'}</div>
    </div>
  </div>

  <div class="row2">
    <div class="card">
      <div class="card-hd"><span class="card-title">Visitors over time</span></div>
      <div class="tabs">
        <div class="tab active" onclick="switchTab(this,'visitors')">Visitors</div>
        <div class="tab" onclick="switchTab(this,'pageviews')">Pageviews</div>
      </div>
      <div class="chart-wrap"><canvas id="mainChart" role="img" aria-label="Daily visitor trend">Daily visitors over time.</canvas></div>
    </div>
    <div class="card">
      <div class="card-hd"><span class="card-title">Live sessions</span><span class="card-action" onclick="showView('recordings')">View all →</span></div>
      ${sessionsHTML(s.recentSessions.slice(0,5))}
    </div>
  </div>

  <div class="row3">
    <div class="card">
      <div class="card-hd"><span class="card-title">Click heatmap</span><span class="card-action" onclick="showView('heatmap')">Full view →</span></div>
      ${miniHeatmapHTML()}
    </div>
    <div class="card">
      <div class="card-hd"><span class="card-title">Conversion funnel</span><span class="card-action" onclick="showView('funnel')">Details →</span></div>
      ${miniFunnelHTML()}
    </div>
    <div class="card">
      <div class="card-hd"><span class="card-title">Annotations</span><span class="card-action" onclick="showView('annotations')">Manage →</span></div>
      ${miniAnnotationsHTML()}
    </div>
  </div>

  <div class="row2">
    <div class="card">
      <div class="card-hd"><span class="card-title">Top pages</span><span class="card-action" onclick="showView('pages')">All pages →</span></div>
      ${topPagesHTML(stats.topPages.slice(0,6))}
    </div>
    <div class="card">
      <div class="card-hd"><span class="card-title">Traffic sources</span><span class="card-action" onclick="showView('sources')">Details →</span></div>
      ${miniSourcesHTML()}
    </div>
  </div>`;
}

function sessionsHTML(sessions) {
  if (!sessions || !sessions.length) return '<p style="color:var(--hint);font-size:12px;text-align:center;padding:20px 0">No sessions yet</p>';
  const colors = ['#dbeafe:#1d4ed8','#dcfce7:#15803d','#fee2e2:#b91c1c','#fef3c7:#b45309','#f3e8ff:#7e22ce'];
  return '<div class="sessions">' + sessions.slice(0,5).map((s, i) => {
    const [bg, fg] = colors[i % colors.length].split(':');
    const init = (s.visitorId || 'AN').substring(0,2).toUpperCase();
    const page = (s.lastPage || s.startPage || '/').replace(/https?:\/\/[^/]+/, '') || '/';
    const badge = s.converted ? '<span class="badge b-green">Converted</span>'
      : s.rageClick ? '<span class="badge b-red">Rage click</span>'

// ── Actions ────────────────────────────────────────────────────────────────
function switchTab(el, type) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}

async function saveAnnotation() {
  const text = document.getElementById('annText')?.value?.trim();
  const date = document.getElementById('annDate')?.value;
  const color = document.getElementById('annColor')?.value;
  if (!text) return;
  try {
    const r = await fetch(API + '/api/annotations', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ siteId: 'demo', text, date, color })
    });
    const ann = await r.json();
    annotations.push(ann);
    const list = document.getElementById('annListFull');
    if (list) {
      const colors = { blue:'var(--accent)', green:'#16a34a', amber:'#d97706', red:'#dc2626' };
      const div = document.createElement('div');
      div.className = 'ann-item';
      div.style.borderLeftColor = colors[ann.color] || 'var(--accent)';
      div.innerHTML = `<div class="ann-dot" style="background:${colors[ann.color]||'var(--accent)'}"></div><div><div class="ann-text">${ann.text}</div><div class="ann-date">${ann.date}</div></div>`;
      list.prepend(div);
    }
    document.getElementById('annText').value = '';
  } catch(e) {}
}

function copySnippet() {
  const text = `<script src="http://localhost:3747/tracklight.js?id=demo" async><\/script>`;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.snippet-copy');
    if (btn) { btn.textContent = 'Copied!'; setTimeout(() => { btn.textContent = 'Copy'; }, 2000); }
  });
}

boot();
</script>
</body>
</html>
