<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrackLight Analytics</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f8f9fb;
  --surface: #ffffff;
  --surface-alt: #f3f4f6;
  --border: rgba(0,0,0,0.08);
  --border-md: rgba(0,0,0,0.14);
  --text: #111827;
  --muted: #6b7280;
  --hint: #9ca3af;
  --accent: #1a6bff;
  --accent-dim: rgba(26,107,255,0.08);
  --red: #dc2626;
  --green: #16a34a;
  --amber: #d97706;
  --radius: 10px;
  --radius-sm: 7px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1117;
    --surface: #1a1d26;
    --surface-alt: #232733;
    --border: rgba(255,255,255,0.07);
    --border-md: rgba(255,255,255,0.14);
    --text: #f3f4f6;
    --muted: #9ca3af;
    --hint: #6b7280;
  }
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; height: 100vh; overflow: hidden; display: flex; }

/* Sidebar */
.sidebar { width: 220px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
.logo { padding: 18px 16px 14px; border-bottom: 1px solid var(--border); }
.logo-row { display: flex; align-items: center; gap: 9px; }
.logo-icon { width: 28px; height: 28px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.logo-icon i { color: #fff; font-size: 15px; }
.logo-name { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
.logo-tag { font-size: 10px; color: var(--hint); margin-top: 1px; }

.nav-section { font-size: 10px; font-weight: 600; color: var(--hint); letter-spacing: 0.6px; text-transform: uppercase; padding: 14px 16px 4px; }
.nav-list { flex: 1; overflow-y: auto; padding-bottom: 8px; }
.nav-item { display: flex; align-items: center; gap: 9px; padding: 7px 16px; font-size: 13px; color: var(--muted); cursor: pointer; border-left: 2px solid transparent; transition: all 0.1s; }
.nav-item:hover { background: var(--bg); color: var(--text); }
.nav-item.active { color: var(--accent); border-left-color: var(--accent); background: var(--accent-dim); font-weight: 500; }
.nav-item i { font-size: 16px; }

.site-pill { margin: 0 12px 14px; padding: 9px 11px; border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; display: flex; align-items: center; gap: 8px; }
.site-pill:hover { border-color: var(--accent); }
.site-pill-info { flex: 1; min-width: 0; }
.site-pill-name { font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 5px; }
.site-pill-url { font-size: 11px; color: var(--hint); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; display: inline-block; animation: blink 1.5s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* Main */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 11px 22px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.topbar-left { display: flex; align-items: center; gap: 12px; }
.page-title { font-size: 15px; font-weight: 600; }
.online-badge { display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 500; color: var(--green); background: #dcfce7; padding: 3px 9px; border-radius: 20px; }
@media (prefers-color-scheme: dark) { .online-badge { background: rgba(34,197,94,0.15); } }
.online-badge.zero { color: var(--muted); background: var(--surface-alt); }
.topbar-right { display: flex; align-items: center; gap: 8px; }
.tb-btn { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); cursor: pointer; transition: all 0.1s; font-family: inherit; }
.tb-btn:hover { border-color: var(--border-md); color: var(--text); }
.tb-btn i { font-size: 14px; }
.tb-btn.primary { color: var(--accent); border-color: rgba(26,107,255,0.25); background: var(--accent-dim); }
.tb-btn.primary:hover { background: rgba(26,107,255,0.14); }

.content { flex: 1; overflow-y: auto; padding: 18px 22px; display: flex; flex-direction: column; gap: 16px; }

/* Metrics row */
.metrics { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
@media (max-width: 1100px) { .metrics { grid-template-columns: repeat(3, 1fr); } }
.metric { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
.metric-lbl { font-size: 11px; color: var(--hint); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
.metric-val { font-size: 24px; font-weight: 600; margin-top: 6px; letter-spacing: -0.5px; }
.metric-sub { font-size: 11px; color: var(--muted); margin-top: 3px; }
.metric-sub.bad { color: var(--red); }
.metric-sub.good { color: var(--green); }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.card-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.card-title { font-size: 13px; font-weight: 600; }
.card-sub { font-size: 11px; color: var(--hint); }

.grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
@media (max-width: 1100px) { .grid-2 { grid-template-columns: 1fr; } }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
@media (max-width: 1100px) { .grid-3 { grid-template-columns: 1fr; } }

/* Pages list */
.pages-list, .src-list, .ann-list { display: flex; flex-direction: column; gap: 8px; }
.pg-row { display: grid; grid-template-columns: 1fr 100px 50px; align-items: center; gap: 10px; font-size: 12px; }
.pg-path { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pg-bar-bg { background: var(--surface-alt); height: 6px; border-radius: 3px; overflow: hidden; }
.pg-bar-fill { background: var(--accent); height: 100%; border-radius: 3px; transition: width 0.3s; }
.pg-num { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Sources */
.src-row { display: grid; grid-template-columns: 80px 1fr 40px; align-items: center; gap: 10px; font-size: 12px; }
.src-lbl { color: var(--text); }
.src-track { background: var(--surface-alt); height: 6px; border-radius: 3px; overflow: hidden; }
.src-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
.src-pct { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Sessions */
.sess-list { display: flex; flex-direction: column; gap: 6px; }
.sess-row { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 12px; }
.sess-icon { width: 26px; height: 26px; flex-shrink: 0; border-radius: 50%; background: var(--accent-dim); color: var(--accent); display: flex; align-items: center; justify-content: center; }
.sess-icon i { font-size: 13px; }
.sess-pg { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sess-info { font-size: 11px; color: var(--hint); margin-top: 2px; }
.sess-badge { font-size: 10px; padding: 2px 6px; border-radius: 8px; font-weight: 500; flex-shrink: 0; }
.sess-badge.conv { background: rgba(22,163,74,0.12); color: var(--green); }
.sess-badge.rage { background: rgba(220,38,38,0.12); color: var(--red); }

/* Heatmap mock */
.hm-outer { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.hm-browser { background: var(--surface-alt); padding: 8px 12px; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid var(--border); }
.hm-dot { width: 9px; height: 9px; border-radius: 50%; }
.hm-url { font-size: 11px; color: var(--muted); margin-left: 12px; font-family: ui-monospace, monospace; }
.hm-body { position: relative; padding: 24px; min-height: 220px; background: var(--surface); }
.hm-page-mock { display: flex; flex-direction: column; gap: 8px; }
.hm-line { height: 10px; background: var(--surface-alt); border-radius: 3px; }
.hm-spot { position: absolute; border-radius: 50%; pointer-events: none; }

/* Funnel */
.funnel-steps { display: flex; flex-direction: column; gap: 10px; }
.fn-step { padding: 0; }
.fn-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
.fn-label { color: var(--text); font-weight: 500; }
.fn-count { color: var(--muted); font-variant-numeric: tabular-nums; }
.fn-bar-bg { background: var(--surface-alt); height: 22px; border-radius: 4px; overflow: hidden; position: relative; }
.fn-bar { height: 100%; border-radius: 4px; transition: width 0.4s; }
.fn-drop { font-size: 10px; color: var(--red); margin-top: 2px; }

/* Annotations */
.ann-item { display: flex; gap: 9px; padding: 9px 11px; border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: var(--radius-sm); }
.ann-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
.ann-text { font-size: 12px; font-weight: 500; }
.ann-date { font-size: 10px; color: var(--hint); margin-top: 2px; }
.ann-form { display: flex; gap: 6px; margin-top: 10px; }
.ann-form input { flex: 1; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 9px; background: var(--surface); color: var(--text); font-size: 12px; font-family: inherit; }

/* Real-time */
.rt-bar { display: flex; align-items: flex-end; gap: 3px; height: 80px; padding: 8px; background: var(--surface-alt); border-radius: var(--radius-sm); margin-bottom: 8px; }
.rt-col { flex: 1; min-height: 2px; background: var(--accent); border-radius: 2px; transition: height 0.3s; }
.rt-col.empty { background: var(--border-md); opacity: 0.4; }

/* Empty state */
.empty { padding: 60px 20px; text-align: center; color: var(--muted); font-size: 13px; }
.empty i { font-size: 36px; color: var(--hint); display: block; margin-bottom: 10px; }
.empty-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 4px; }

/* Install snippet */
.snippet-box { background: #0d1117; color: #e6edf3; padding: 14px 16px; border-radius: var(--radius); font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12.5px; overflow-x: auto; position: relative; word-break: break-all; }
.snippet-copy { position: absolute; top: 8px; right: 8px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); color: #e6edf3; padding: 4px 10px; border-radius: 5px; font-size: 11px; cursor: pointer; }
.snippet-copy:hover { background: rgba(255,255,255,0.16); }

/* Forms */
.form-row { margin-bottom: 12px; }
.form-row label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.4px; }
.form-row input { width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 11px; background: var(--surface); color: var(--text); font-size: 13px; font-family: inherit; }
.form-row input:focus { outline: none; border-color: var(--accent); }
.form-row .hint { font-size: 11px; color: var(--hint); margin-top: 4px; }

/* Modal */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 100; }
.modal-bg.show { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; width: 440px; max-width: 90vw; }
.modal-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

/* Site list */
.site-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 8px; }
.site-row-info { flex: 1; }
.site-row-name { font-size: 13px; font-weight: 500; }
.site-row-id { font-size: 11px; color: var(--hint); margin-top: 2px; font-family: ui-monospace, monospace; }
.site-row-actions { display: flex; gap: 6px; }
.icon-btn { background: transparent; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 5px 8px; cursor: pointer; color: var(--muted); }
.icon-btn:hover { color: var(--text); border-color: var(--border-md); }
.icon-btn.danger:hover { color: var(--red); border-color: var(--red); }

/* Loading */
.loader { padding: 40px; text-align: center; color: var(--muted); font-size: 13px; }

/* Chart container */
.chart-box { position: relative; height: 240px; }
.chart-box canvas { max-height: 240px; }

/* Banner */
.banner { background: var(--accent-dim); border: 1px solid rgba(26,107,255,0.25); border-radius: var(--radius); padding: 11px 14px; font-size: 12.5px; color: var(--text); display: flex; gap: 10px; align-items: center; }
.banner i { color: var(--accent); font-size: 16px; flex-shrink: 0; }
.banner.amber { background: rgba(217,119,6,0.08); border-color: rgba(217,119,6,0.25); }
.banner.amber i { color: var(--amber); }
</style>
</head>
<body>

<div class="sidebar">
  <div class="logo">
    <div class="logo-row">
      <div class="logo-icon"><i class="ti ti-activity"></i></div>
      <div>
        <div class="logo-name">TrackLight</div>
        <div class="logo-tag">Analytics</div>
      </div>
    </div>
  </div>

  <div class="nav-list">
    <div class="nav-section">Analytics</div>
    <div class="nav-item active" data-view="dashboard"><i class="ti ti-layout-dashboard"></i> Dashboard</div>
    <div class="nav-item" data-view="realtime"><i class="ti ti-broadcast"></i> Real-time</div>
    <div class="nav-item" data-view="pages"><i class="ti ti-files"></i> Top pages</div>
    <div class="nav-item" data-view="sources"><i class="ti ti-arrow-fork"></i> Traffic sources</div>
    <div class="nav-item" data-view="heatmap"><i class="ti ti-flame"></i> Heatmaps</div>
    <div class="nav-item" data-view="funnel"><i class="ti ti-filter"></i> Funnel</div>
    <div class="nav-item" data-view="sessions"><i class="ti ti-user-circle"></i> Sessions</div>

    <div class="nav-section">Tools</div>
    <div class="nav-item" data-view="annotations"><i class="ti ti-note"></i> Annotations</div>
    <div class="nav-item" data-view="install"><i class="ti ti-code"></i> Install</div>
    <div class="nav-item" data-view="sites"><i class="ti ti-world"></i> Sites</div>
  </div>

  <div class="site-pill" onclick="showView('sites')" id="sitePill">
    <div class="site-pill-info">
      <div class="site-pill-name"><span class="live-dot"></span> <span id="sitePillName">Loading...</span></div>
      <div class="site-pill-url" id="sitePillUrl">—</div>
    </div>
    <i class="ti ti-chevron-right" style="color:var(--hint);font-size:14px;"></i>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <span class="page-title" id="viewTitle">Dashboard</span>
      <span class="online-badge zero" id="onlineBadge"><span class="live-dot"></span> <span id="onlineCount">0</span> online</span>
    </div>
    <div class="topbar-right">
      <select class="tb-btn" id="siteSelect" onchange="changeSite(this.value)"></select>
      <select class="tb-btn" id="daySelect" onchange="loadAll()">
        <option value="7">Last 7 days</option>
        <option value="30" selected>Last 30 days</option>
        <option value="90">Last 90 days</option>
      </select>
      <button class="tb-btn" onclick="loadAll()"><i class="ti ti-refresh"></i> Refresh</button>
      <button class="tb-btn primary" onclick="showView('install')"><i class="ti ti-code"></i> Install</button>
    </div>
  </div>

  <div class="content" id="content">
    <div class="loader">Loading...</div>
  </div>
</div>

<!-- Add site modal -->
<div class="modal-bg" id="addSiteModal">
  <div class="modal">
    <div class="modal-title">Add a new site</div>
    <div class="form-row">
      <label>Site name</label>
      <input id="newSiteName" placeholder="e.g. Pilchard Properties">
    </div>
    <div class="form-row">
      <label>Site ID (used in the tracking script)</label>
      <input id="newSiteId" placeholder="e.g. pilchard">
      <div class="hint">Letters, numbers, dash and underscore only. Cannot be changed later.</div>
    </div>
    <div class="form-row">
      <label>Domain (optional)</label>
      <input id="newSiteDomain" placeholder="e.g. pilchardproperties.com">
    </div>
    <div id="addSiteError" style="color:var(--red);font-size:12px;margin-bottom:8px;display:none;"></div>
    <div class="modal-actions">
      <button class="tb-btn" onclick="closeAddSite()">Cancel</button>
      <button class="tb-btn primary" onclick="submitAddSite()">Add site</button>
    </div>
  </div>
</div>

<script>
const API = '';
let state = {
  sites: [],
  currentSite: null,
  stats: null,
  realtime: { online: 0, perMinute: [], activePages: [] },
  heatmap: [],
  heatmapPages: [],
  annotations: [],
  view: 'dashboard',
  days: 30
};
let mainChart = null;

// ── Boot ───────────────────────────────────────────────────────────────────
async function boot() {
  await loadSites();
  if (!state.sites.length) {
    showView('sites');
    document.getElementById('content').innerHTML = sitesEmptyHTML();
    return;
  }
  // Restore last selected site from localStorage if present
  const saved = localStorage.getItem('_tl_currentSite');
  state.currentSite = (saved && state.sites.find(s => s.id === saved)) ? saved : state.sites[0].id;
  renderSitePicker();
  await loadAll();
  // Real-time refresh every 6s
  setInterval(loadRealtime, 6000);
  // Refresh current view every 60s
  setInterval(() => { if (state.view !== 'install' && state.view !== 'sites') loadAll(); }, 60000);
}

async function loadSites() {
  try {
    const r = await fetch(API + '/api/sites');
    state.sites = await r.json();
  } catch(e) { state.sites = []; }
}

function renderSitePicker() {
  const sel = document.getElementById('siteSelect');
  sel.innerHTML = state.sites.map(s =>
    `<option value="${s.id}" ${s.id === state.currentSite ? 'selected' : ''}>${escapeHtml(s.name)}</option>`
  ).join('');

  const site = state.sites.find(s => s.id === state.currentSite);
  if (site) {
    document.getElementById('sitePillName').textContent = site.name;
    document.getElementById('sitePillUrl').textContent = site.domain || site.id;
  }
}

function changeSite(id) {
  state.currentSite = id;
  localStorage.setItem('_tl_currentSite', id);
  renderSitePicker();
  loadAll();
}

async function loadAll() {
  if (!state.currentSite) return;
  state.days = parseInt(document.getElementById('daySelect').value) || 30;
  try {
    const [s, h, hp, a] = await Promise.all([
      fetch(`${API}/api/stats?siteId=${state.currentSite}&days=${state.days}`).then(r => r.json()),
      fetch(`${API}/api/heatmap?siteId=${state.currentSite}`).then(r => r.json()),
      fetch(`${API}/api/heatmap/pages?siteId=${state.currentSite}`).then(r => r.json()),
      fetch(`${API}/api/annotations?siteId=${state.currentSite}`).then(r => r.json())
    ]);
    state.stats = s;
    state.heatmap = h;
    state.heatmapPages = hp;
    state.annotations = a;
    await loadRealtime();
    renderView();
  } catch(e) {
    document.getElementById('content').innerHTML =
      '<div class="empty"><i class="ti ti-cloud-off"></i><div class="empty-title">Could not load data</div><div>Make sure the server is running.</div></div>';
  }
}

async function loadRealtime() {
  if (!state.currentSite) return;
  try {
    const r = await fetch(`${API}/api/realtime?siteId=${state.currentSite}`);
    state.realtime = await r.json();
    const badge = document.getElementById('onlineBadge');
    document.getElementById('onlineCount').textContent = state.realtime.online;
    if (state.realtime.online > 0) badge.classList.remove('zero');
    else badge.classList.add('zero');
    if (state.view === 'realtime') renderView();
  } catch(e) {}
}

// ── Navigation ─────────────────────────────────────────────────────────────
document.querySelectorAll('.nav-item').forEach(el => {
  el.addEventListener('click', () => showView(el.dataset.view));
});

function showView(v) {
  state.view = v;
  const titles = { dashboard:'Dashboard', realtime:'Real-time', heatmap:'Heatmaps', sessions:'Sessions', funnel:'Conversion funnel', pages:'Top pages', sources:'Traffic sources', annotations:'Annotations', install:'Install snippet', sites:'Sites' };
  document.getElementById('viewTitle').textContent = titles[v] || v;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const nav = document.querySelector(`.nav-item[data-view="${v}"]`);
  if (nav) nav.classList.add('active');
  renderView();
}

function renderView() {
  const c = document.getElementById('content');
  if (state.view === 'sites' || (state.view === 'install' && !state.sites.length)) {
    c.innerHTML = sitesViewHTML();
    return;
  }
  if (!state.stats) { c.innerHTML = '<div class="loader">Loading...</div>'; return; }

  const totalEvents = state.stats.pageviews + state.stats.funnel.formStarts;
  const hasData = totalEvents > 0;

  switch(state.view) {
    case 'dashboard': c.innerHTML = hasData ? dashboardHTML() : noDataHTML(); break;
    case 'realtime':  c.innerHTML = realtimeHTML(); break;
    case 'heatmap':   c.innerHTML = heatmapViewHTML(); break;
    case 'sessions':  c.innerHTML = sessionsViewHTML(); break;
    case 'funnel':    c.innerHTML = funnelViewHTML(); break;
    case 'pages':     c.innerHTML = pagesViewHTML(); break;
    case 'sources':   c.innerHTML = sourcesViewHTML(); break;
    case 'annotations': c.innerHTML = annotationsViewHTML(); break;
    case 'install':   c.innerHTML = installViewHTML(); break;
    default: c.innerHTML = dashboardHTML();
  }

  if (state.view === 'dashboard' && hasData) drawMainChart();
}

// ── Helpers ────────────────────────────────────────────────────────────────
function fmt(n) { if (n == null) return '0'; if (n >= 1000) return (n / 1000).toFixed(1) + 'k'; return String(n); }
function fmtDur(s) { if (!s) return '0s'; if (s < 60) return s + 's'; const m = Math.floor(s / 60); return m + 'm ' + (s % 60) + 's'; }
function pct(a, b) { if (!b) return 0; return Math.round((a / b) * 100); }
function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function drawMainChart() {
  const canvas = document.getElementById('mainChart');
  if (!canvas) return;
  if (mainChart) mainChart.destroy();
  const labels = state.stats.daily.map(d => d.date.slice(5));
  const data = state.stats.daily.map(d => d.visitors);
  const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  mainChart = new Chart(canvas, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Pageviews',
        data,
        borderColor: '#1a6bff',
        backgroundColor: 'rgba(26,107,255,0.1)',
        fill: true,
        tension: 0.3,
        pointRadius: 0,
        pointHoverRadius: 4,
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false }, ticks: { color: isDark ? '#9ca3af' : '#6b7280', font: { size: 10 }, maxRotation: 0, autoSkipPadding: 20 } },
        y: { grid: { color: isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)' }, ticks: { color: isDark ? '#9ca3af' : '#6b7280', font: { size: 10 } }, beginAtZero: true }
      }
    }
  });
}

// ── Heatmap view ───────────────────────────────────────────────────────────
function heatmapViewHTML() {
  const total = state.heatmap.length;
  if (!total) {
    return `<div class="card"><div class="empty"><i class="ti ti-flame"></i><div class="empty-title">No click data yet</div><div>Heatmap clicks will appear here once visitors interact with your site.</div></div></div>`;
  }
  // Real density-based intensity using a grid
  const grid = {};
  state.heatmap.forEach(p => {
    const key = Math.floor(p.x / 4) + ',' + Math.floor(p.y / 4);
    grid[key] = (grid[key] || 0) + 1;
  });
  const maxDensity = Math.max(...Object.values(grid));
  const spots = state.heatmap.slice(0, 200).map(p => {
    const key = Math.floor(p.x / 4) + ',' + Math.floor(p.y / 4);
    const d = grid[key] || 1;
    const intensity = d / maxDensity;
    let c;
    if (intensity > 0.7) c = 'rgba(239,68,68,0.55)';
    else if (intensity > 0.4) c = 'rgba(245,158,11,0.5)';
    else c = 'rgba(59,130,246,0.4)';
    const r = 10 + Math.round(intensity * 18);
    return `<div class="hm-spot" style="left:${p.x}%;top:${p.y}%;width:${r*2}px;height:${r*2}px;transform:translate(-50%,-50%);background:${c};filter:blur(${r*0.5}px);"></div>`;
  }).join('');

  return `
    <div class="grid-2">
      <div class="card">
        <div class="card-hd"><span class="card-title">Click heatmap</span><span class="card-sub">${total} clicks recorded</span></div>
        <div class="hm-outer">
          <div class="hm-browser">
            <div class="hm-dot" style="background:#ef4444"></div>
            <div class="hm-dot" style="background:#f59e0b"></div>
            <div class="hm-dot" style="background:#22c55e"></div>
            <span class="hm-url">Aggregated clicks across all pages</span>
          </div>
          <div class="hm-body">
            <div class="hm-page-mock">
              <div class="hm-line" style="width:60%"></div>
              <div class="hm-line" style="width:80%"></div>
              <div class="hm-line" style="width:40%"></div>
              <div class="hm-line" style="width:70%;margin-top:8px"></div>
              <div class="hm-line" style="width:50%"></div>
              <div class="hm-line" style="width:65%"></div>
            </div>
            ${spots}
          </div>
        </div>
        <div style="display:flex;gap:14px;margin-top:10px;font-size:11px;color:var(--hint);">
          <span style="display:flex;align-items:center;gap:5px;"><span style="width:8px;height:8px;border-radius:50%;background:#ef4444"></span>Hot (high density)</span>
          <span style="display:flex;align-items:center;gap:5px;"><span style="width:8px;height:8px;border-radius:50%;background:#f59e0b"></span>Warm</span>
          <span style="display:flex;align-items:center;gap:5px;"><span style="width:8px;height:8px;border-radius:50%;background:#3b82f6"></span>Low</span>
        </div>
      </div>
      <div class="card">
        <div class="card-hd"><span class="card-title">Pages by click count</span></div>
        ${state.heatmapPages.length
          ? '<div class="pages-list">' + state.heatmapPages.map(p => `
            <div class="pg-row">
              <div class="pg-path">${escapeHtml(p.page)}</div>
              <div><div class="pg-bar-bg"><div class="pg-bar-fill" style="width:${pct(p.clicks, state.heatmapPages[0].clicks)}%"></div></div></div>
              <div class="pg-num">${fmt(p.clicks)}</div>
            </div>`).join('') + '</div>'
          : '<p style="color:var(--hint);font-size:12px">No page data yet</p>'}
      </div>
    </div>
  `;
}

// ── Sessions view ──────────────────────────────────────────────────────────
function sessionsViewHTML() {
  const list = state.stats.recentSessions || [];
  return `<div class="card">
    <div class="card-hd">
      <span class="card-title">Recent sessions</span>

}

function sessionsHTML(list, max) {
  if (!list || !list.length) return '<p style="color:var(--hint);font-size:12px;padding:8px 0">No sessions yet</p>';
  return '<div class="sess-list">' + list.slice(0, max || 6).map(s => {
    const page = (s.lastPage || s.startPage || '/').replace(/^https?:\/\/[^/]+/, '') || '/';
    const badges = [];
    if (s.converted) badges.push('<span class="sess-badge conv">Conv</span>');
    if (s.rageClick) badges.push('<span class="sess-badge rage">Rage</span>');
    const icon = s.converted ? 'ti-check' : s.rageClick ? 'ti-alert-triangle' : 'ti-eye';
    return `<div class="sess-row">
      <div class="sess-icon"><i class="ti ${icon}"></i></div>
      <div style="flex:1;min-width:0">
        <div class="sess-pg">${escapeHtml(page)}</div>
        <div class="sess-info">${escapeHtml(s.city || '—')} · ${fmtDur(s.duration)} · ${s.pageCount || 0} page${s.pageCount === 1 ? '' : 's'} · scroll ${s.scrollDepth || 0}%</div>
      </div>
      ${badges.join(' ')}
    </div>`;
  }).join('') + '</div>';
}

// ── Funnel view ────────────────────────────────────────────────────────────
function funnelViewHTML() {
  return `<div class="card" style="max-width:720px">
    <div class="card-hd"><span class="card-title">Conversion funnel</span></div>
    ${funnelHTML(state.stats.funnel)}
    ${state.stats.funnel.formStarts > 0 && state.stats.funnel.formCompletes === 0
      ? '<div class="banner amber" style="margin-top:14px"><i class="ti ti-alert-triangle"></i><div>Users started forms but none completed — there may be a form bug or honeypot issue. Check your contact form.</div></div>'
      : ''}
  </div>`;
}

function funnelHTML(f) {
  if (!f) return '';
  const max = Math.max(f.sessions, 1);
  const steps = [
    { label: 'Sessions', val: f.sessions, color: '#1a6bff' },
    { label: 'Pageviews', val: f.pageviews, color: '#1a6bff' },
    { label: 'Form started', val: f.formStarts, color: '#f59e0b' },
    { label: 'Form completed', val: f.formCompletes, color: f.formCompletes === 0 ? '#dc2626' : '#16a34a' },
    { label: 'Converted', val: f.conversions, color: f.conversions === 0 ? '#dc2626' : '#16a34a' }
  ];
  return '<div class="funnel-steps">' + steps.map((s, i) => {
    const prev = i > 0 ? steps[i-1].val : null;
    const dropPct = (prev != null && prev > 0) ? Math.round((1 - s.val / prev) * 100) : 0;
    const drop = (i > 0 && dropPct > 0) ? `<div class="fn-drop">−${dropPct}% drop-off</div>` : '';
    const w = Math.max(2, Math.round((s.val / max) * 100));
    return `<div class="fn-step">
      <div class="fn-row"><span class="fn-label">${s.label}</span><span class="fn-count">${fmt(s.val)}</span></div>
      <div class="fn-bar-bg"><div class="fn-bar" style="width:${w}%;background:${s.color}"></div></div>
      ${drop}
    </div>`;
  }).join('') + '</div>';
}

      <div><div class="pg-bar-bg"><div class="pg-bar-fill" style="width:${pct(p.views, max)}%"></div></div></div>
      <div class="pg-num">${fmt(p.views)}</div>

function sourcesViewHTML() {
  return `<div class="grid-2">
    <div class="card">
      <div class="card-hd"><span class="card-title">Traffic sources</span></div>
      ${sourcesHTML(state.stats.sources)}
    </div>

      <div class="card-hd"><span class="card-title">Top countries</span></div>

function sourcesHTML(src) {
  src = src || {};
  const total = Object.values(src).reduce((a, b) => a + b, 0);
  if (!total) return '<p style="color:var(--hint);font-size:12px;padding:8px 0">No source data yet</p>';
  const colors = { Organic:'#1a6bff', Direct:'#8b5cf6', Social:'#f59e0b', Referral:'#22c55e', Email:'#ef4444', Paid:'#6b7280' };
  const sorted = Object.entries(src).sort((a, b) => b[1] - a[1]);
  return '<div class="src-list">' + sorted.map(([k, v]) => `
    <div class="src-row">
      <span class="src-lbl">${escapeHtml(k)}</span>
      <div class="src-track"><div class="src-fill" style="width:${pct(v, total)}%;background:${colors[k] || '#6b7280'}"></div></div>
      <span class="src-pct">${pct(v, total)}%</span>
    </div>`).join('') + '</div>';
}

function countriesHTML(list) {
  if (!list || !list.length) return '<p style="color:var(--hint);font-size:12px;padding:8px 0">No country data yet</p>';
  const max = list[0].count;
  return '<div class="pages-list">' + list.map(c => `
    <div class="pg-row">
      <div class="pg-path">${escapeHtml(c.country)}</div>
      <div><div class="pg-bar-bg"><div class="pg-bar-fill" style="width:${pct(c.count, max)}%"></div></div></div>
      <div class="pg-num">${fmt(c.count)}</div>
    </div>`).join('') + '</div>';
}

  return `<div class="card" style="max-width:720px">

    ${list.length

    <div class="ann-form">

async function addAnnotation() {
  const text = document.getElementById('annText').value.trim();
  const date = document.getElementById('annDate').value;
  if (!text) return;
  await fetch(API + '/api/annotations', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ siteId: state.currentSite, text, date, color: 'blue' })
  });
  await loadAll();
}

async function deleteAnnotation(id) {
  if (!confirm('Delete this annotation?')) return;
  await fetch(`${API}/api/annotations/${id}`, { method: 'DELETE' });
  await loadAll();
}

        </details>
      </div>

      <div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--border);font-size:11.5px;color:var(--hint)">
        <b style="color:var(--muted)">Custom events:</b> from your site's JavaScript you can call <code>TrackLight.track('event_name', { foo: 'bar' })</code> to track anything custom.
      </div>
    </div>
  `;
}

function copySnippet(btn) {
  const box = btn.parentElement;
  // Get text without the button label
  const text = box.textContent.replace('Copy', '').trim();
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'Copied';
    setTimeout(() => btn.textContent = 'Copy', 1500);
  });
}

// ── Sites view ─────────────────────────────────────────────────────────────
function sitesViewHTML() {
  return `
    <div class="card" style="max-width:720px">
      <div class="card-hd">
        <span class="card-title">Your sites</span>
        <button class="tb-btn primary" onclick="openAddSite()"><i class="ti ti-plus"></i> Add site</button>
      </div>
      ${state.sites.length
        ? state.sites.map(s => `
          <div class="site-row">
            <div class="site-row-info">
              <div class="site-row-name">${escapeHtml(s.name)}</div>
              <div class="site-row-id">${escapeHtml(s.domain || '—')} · id: <code>${escapeHtml(s.id)}</code></div>
            </div>
            <div class="site-row-actions">
              <button class="icon-btn" onclick="changeSite('${s.id}');showView('dashboard')" title="View"><i class="ti ti-arrow-right"></i></button>
              <button class="icon-btn" onclick="resetSiteData('${s.id}', '${escapeHtml(s.name)}')" title="Reset data"><i class="ti ti-refresh"></i></button>
              <button class="icon-btn danger" onclick="deleteSite('${s.id}', '${escapeHtml(s.name)}')" title="Delete"><i class="ti ti-trash"></i></button>
            </div>
          </div>
        `).join('')
        : '<div class="empty"><i class="ti ti-world"></i><div class="empty-title">No sites yet</div><div>Add your first site to start tracking visitors.</div><br><button class="tb-btn primary" onclick="openAddSite()"><i class="ti ti-plus"></i> Add your first site</button></div>'}

      <div class="banner amber" style="margin-top:14px">
        <i class="ti ti-info-circle"></i>
        <div><b>Heads up:</b> on free Railway, the data file lives on the container's local disk and is wiped on every redeploy. Add a persistent volume (Railway → Variables → Volumes) or use a real database before relying on this in production.</div>
      </div>
    </div>
  `;
}

function sitesEmptyHTML() {
  return `<div class="card" style="max-width:540px;margin:60px auto"><div class="empty">
    <i class="ti ti-world"></i>
    <div class="empty-title">Welcome to TrackLight</div>
    <div>Add your first site to start tracking visitors.</div><br>
    <button class="tb-btn primary" onclick="openAddSite()"><i class="ti ti-plus"></i> Add your first site</button>
  </div></div>`;
}

function openAddSite() {
  document.getElementById('newSiteName').value = '';
  document.getElementById('newSiteId').value = '';
  document.getElementById('newSiteDomain').value = '';
  document.getElementById('addSiteError').style.display = 'none';
  document.getElementById('addSiteModal').classList.add('show');
}
function closeAddSite() { document.getElementById('addSiteModal').classList.remove('show'); }

async function submitAddSite() {
  const name = document.getElementById('newSiteName').value.trim();
  const id = document.getElementById('newSiteId').value.trim().toLowerCase();
  const domain = document.getElementById('newSiteDomain').value.trim();
  const err = document.getElementById('addSiteError');
  err.style.display = 'none';
  if (!name || !id) { err.textContent = 'Name and ID are required.'; err.style.display = 'block'; return; }
  try {
    const r = await fetch(API + '/api/sites', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, name, domain })
    });
    const data = await r.json();
    if (!r.ok) { err.textContent = data.error || 'Could not add site.'; err.style.display = 'block'; return; }
    closeAddSite();
    await loadSites();
    changeSite(id);
    showView('install');
  } catch(e) {
    err.textContent = 'Network error.'; err.style.display = 'block';
  }
}

async function deleteSite(id, name) {
  if (!confirm(`Delete site "${name}" and all its data? This cannot be undone.`)) return;
  await fetch(`${API}/api/sites/${id}`, { method: 'DELETE' });
  await loadSites();
  if (state.currentSite === id) {
    state.currentSite = state.sites[0] ? state.sites[0].id : null;
    localStorage.removeItem('_tl_currentSite');
  }
  if (!state.currentSite) {
    renderView();
  } else {
    renderSitePicker();
    loadAll();
  }
}

async function resetSiteData(id, name) {
  if (!confirm(`Wipe all visitor data for "${name}"? The site itself stays, but every event, session, heatmap click and annotation is deleted. This cannot be undone.`)) return;
  await fetch(`${API}/api/sites/${id}/reset`, { method: 'POST' });
  if (state.currentSite === id) await loadAll();
  else renderView();
}

// ── Go ─────────────────────────────────────────────────────────────────────
boot();
</script>
</body>
</html>
